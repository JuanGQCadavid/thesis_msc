apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-restarter
  namespace: db-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-restarter-role
  namespace: db-api
rules:
  - apiGroups: ["apps", "extensions"]
    resources: ["deployments"]
    verbs: ["get", "patch", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-restarter-binding
  namespace: db-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout-restarter-role
subjects:
  - kind: ServiceAccount
    name: rollout-restarter
    namespace: db-api
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reset-db-api
  namespace: db-api
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: rollout-restarter
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - "kubectl rollout restart deployment db-api -n db-api"
          restartPolicy: OnFailure
