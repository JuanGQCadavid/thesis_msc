image:
  repository: ghcr.io/juangqcadavid/thesis_reverse_proxy
  #tag: sha-e2a9702
  tag: sha-b818df3

proxy_config:
  config:
    # Dead letter queue
    dlq:
      - type: kafka
        name: principal
        topic: "dlq-calls"
        uri: "kafka-controller-0.kafka-controller-headless.kafka.svc.cluster.local:9092"
    downstream:
      principal:
        origin_server_uri: "questdb.questdb.svc.cluster.local:9000"
        dlq:
          enable: true
          name: principal
      secondary:
        - origin_server_uri: "read-replica-questdb.read-replica-questdb.svc.cluster.local:9000" # QuestDB secondary
    rules: # ORDER MATTERS
      - regex: "/(write).*"
        name: "questDB insert"
        proxy:
          compress:
            enable: true
            method: gzip
        buffer:
          enable: true
          retain: # Both should be specified
            requests: 300 # number IPL
            timeout: 1m
          origin_server_request:
            http:
              status_line:
                http_version: HTTP/1.1
                resource: /write?precision=n
                method: POST
              headers:
                authorization: Basic YWRtaW46cGFzc3dvcmQ=
          default_response:
            http:
              status_line:
                http_version: HTTP/1.1
                status_code: 204 No Content
              headers:
                Server: questDB/1.0
      - regex: "/settings"
        name: "cache settings"
        proxy:
          compress:
            enable: true
            method: gzip
        cache: # Cache only works for GET request
          enable: true
          ttl: 1m # Valid time units are "ns", "us" (or "µs"), "ms", "s", "m", "h".
      # TODO: Should I collect metrics for all of this?
      - regex: "/.*"
        name: "proxy all"
        proxy:
          compress:
            enable: true
            method: gzip

resources:
  requests:
    cpu: 500m
    memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe: {}
#  httpGet:
#    path: /ping
#    port: app
#  initialDelaySeconds: 5
#  periodSeconds: 3

readinessProbe:
  httpGet:
    path: /ping
    port: app
  initialDelaySeconds: 5
  periodSeconds: 3